# Automated phone catalog refresh.
#
# Scheduled runs are split into a cheap weekly open-source pass and a monthly
# licensed-source pass. Discovery, MobileAPI sync, OEM enrichment, and promotion
# make zero LLM calls. Optional Wikipedia/GSMArena enrichment and spec embeddings
# run only when a Gemini key is configured.
name: catalog auto (refresh + media backfill)

on:
  schedule:
    # Weekly lightweight scout: Wikidata staging + official OEM enrichment.
    - cron: '17 1 * * 1'
    # Monthly full pass: includes MobileAPI when the optional secret exists.
    - cron: '47 1 1 * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to run'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - wikidata
          - mobileapi
      since_years:
        description: 'Lookback window in years'
        required: false
        default: '2'
        type: string
      limit:
        description: 'Max candidates/devices per source'
        required: false
        default: '150'
        type: string
      mobileapi_max_requests:
        description: 'MobileAPI request cap for this run'
        required: false
        default: '50'
        type: string
      oem_enrich:
        description: 'Fetch official OEM pages from staged candidates'
        required: false
        default: true
        type: boolean
      oem_limit:
        description: 'Max official OEM pages to fetch'
        required: false
        default: '25'
        type: string
      promote:
        description: 'Promote complete structured MobileAPI records'
        required: false
        default: true
        type: boolean
      media_backfill:
        description: 'Validate and fill missing phone images'
        required: false
        default: true
        type: boolean
      media_limit:
        description: 'Max phones to check for missing images'
        required: false
        default: '50'
        type: string

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  secrets-gate:
    name: Check catalog secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      mobileapi: ${{ steps.check.outputs.mobileapi }}
      gemini: ${{ steps.check.outputs.gemini }}
    steps:
      - id: check
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          MOBILEAPI_API_KEY: ${{ secrets.MOBILEAPI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Catalog DB/Supabase secrets incomplete; skipping refresh."
          fi

          if [ -n "$MOBILEAPI_API_KEY" ]; then
            echo "mobileapi=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobileapi=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$GEMINI_API_KEY" ]; then
            echo "gemini=true" >> "$GITHUB_OUTPUT"
          else
            echo "gemini=false" >> "$GITHUB_OUTPUT"
          fi

  catalog:
    name: Refresh catalog
    needs: secrets-gate
    if: needs.secrets-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: production
      NODE_OPTIONS: --dns-result-order=ipv4first
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      MOBILEAPI_API_KEY: ${{ secrets.MOBILEAPI_API_KEY }}
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_RATE_LIMIT_PROFILE: google_ai_studio_free
      GEMINI_FREE_RPM: '5'
      GEMINI_FREE_TPM_INPUT: '250000'
      GEMINI_FREE_RPD: '20'
      LOG_LEVEL: info
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backfill legacy identities
        run: pnpm exec tsx scripts/backfill/canonical-keys.ts

      - name: Run catalog refresh
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"
          SCHEDULE="${{ github.event.schedule }}"

          if [ "$EVENT_NAME" = "schedule" ]; then
            SINCE_YEARS="2"
            PROMOTE="true"
            OEM_ENRICH="true"
            MEDIA_BACKFILL="true"
            MEDIA_LIMIT="50"

            if [ "$SCHEDULE" = "47 1 1 * *" ]; then
              SOURCE="both"
              LIMIT="150"
              MOBILEAPI_MAX_REQUESTS="50"
              OEM_LIMIT="25"
              echo "[catalog-refresh] monthly full scheduled run"
            else
              SOURCE="wikidata"
              LIMIT="75"
              MOBILEAPI_MAX_REQUESTS="0"
              OEM_LIMIT="10"
              echo "[catalog-refresh] weekly lightweight scheduled run"
            fi
          else
            SOURCE="${{ github.event.inputs.source || 'both' }}"
            SINCE_YEARS="${{ github.event.inputs.since_years || '2' }}"
            LIMIT="${{ github.event.inputs.limit || '150' }}"
            MOBILEAPI_MAX_REQUESTS="${{ github.event.inputs.mobileapi_max_requests || '50' }}"
            OEM_ENRICH="${{ github.event.inputs.oem_enrich || 'true' }}"
            OEM_LIMIT="${{ github.event.inputs.oem_limit || '25' }}"
            PROMOTE="${{ github.event.inputs.promote || 'true' }}"
            MEDIA_BACKFILL="${{ github.event.inputs.media_backfill || 'true' }}"
            MEDIA_LIMIT="${{ github.event.inputs.media_limit || '50' }}"
          fi

          if [ "$SOURCE" = "both" ] || [ "$SOURCE" = "wikidata" ]; then
            pnpm exec tsx scripts/catalog-refresh.ts --source wikidata --since-years "$SINCE_YEARS" --limit "$LIMIT"
          fi

          if [ "$SOURCE" = "both" ] || [ "$SOURCE" = "mobileapi" ]; then
            if [ "$MOBILEAPI_MAX_REQUESTS" = "0" ]; then
              echo "[catalog-refresh] MobileAPI skipped for this scheduled cadence."
            elif [ "${{ needs.secrets-gate.outputs.mobileapi }}" = "true" ]; then
              ARGS="--since-years $SINCE_YEARS --limit $LIMIT --max-requests $MOBILEAPI_MAX_REQUESTS --min-request-gap-ms 12500"
              if [ "$PROMOTE" = "true" ]; then
                ARGS="$ARGS --promote --update-existing"
              fi
              pnpm exec tsx scripts/catalog-sync-mobileapi.ts $ARGS
            elif [ "$EVENT_NAME" = "schedule" ]; then
              echo "::notice title=Skipping MobileAPI::MOBILEAPI_API_KEY is not configured; scheduled catalog refresh will continue with open sources only."
            else
              echo "::error title=Missing MOBILEAPI_API_KEY::Source '$SOURCE' includes MobileAPI, but the MOBILEAPI_API_KEY repository secret is not configured. Add the secret or run the workflow with source=wikidata."
              exit 1
            fi
          fi

          if [ "$OEM_ENRICH" = "true" ]; then
            ARGS="--from-candidates --limit $OEM_LIMIT --min-request-gap-ms 2000"
            if [ "$PROMOTE" = "true" ]; then
              ARGS="$ARGS --promote --update-existing"
            fi
            pnpm exec tsx scripts/catalog-enrich-oem.ts $ARGS
          fi

          if [ "${{ needs.secrets-gate.outputs.gemini }}" = "true" ]; then
            pnpm exec tsx scripts/catalog-enrich-gsmarena.ts --limit "$OEM_LIMIT"
            pnpm exec tsx scripts/catalog-promote.ts --ready --limit 50 --update-existing
          else
            echo "::notice title=Skipping Wikipedia enrichment::GEMINI_API_KEY is not configured. Pending catalog candidates will remain staged until a no-LLM OEM source or structured import supplies complete specs."
          fi

          if [ "$MEDIA_BACKFILL" = "true" ]; then
            pnpm exec tsx scripts/catalog-backfill-media.ts --limit "$MEDIA_LIMIT" --min-request-gap-ms 1250
          fi

      - name: Backfill spec embeddings for promoted phones
        if: success() && needs.secrets-gate.outputs.gemini == 'true'
        run: |
          # Generate spec_embedding for any phone promoted or updated this run
          # (promotion sets spec_embedding = NULL). The backfill script processes
          # only NULL rows by default so this is safe to run every time.
          pnpm exec tsx scripts/backfill-spec-embeddings.ts

      - name: Skip spec embeddings when Gemini is unavailable
        if: success() && needs.secrets-gate.outputs.gemini != 'true'
        run: |
          echo "::notice title=Skipping spec embeddings::GEMINI_API_KEY is not configured. Catalog refresh completed, but newly promoted phones may need pnpm spec-embed:backfill later."

      - name: Catalog report
        if: always()
        run: pnpm exec tsx scripts/catalog-report.ts --days 35

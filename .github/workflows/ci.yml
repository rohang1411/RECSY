name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same ref so PR pushes don't stack.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    env:
      # Tests and type-checking touch @/env but do NOT require live services.
      # `SKIP_ENV_VALIDATION` short-circuits the Zod schema so CI can run offline.
      SKIP_ENV_VALIDATION: 'true'
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

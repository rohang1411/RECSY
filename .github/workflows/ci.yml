name: CI

on:
  pull_request:
  push:
    branches: [master, main]

# Cancel in-progress runs for the same ref so PR pushes don't stack.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    env:
      # Tests and type-checking touch @/env but do NOT require live services.
      # `SKIP_ENV_VALIDATION` short-circuits the Zod schema so CI can run offline.
      SKIP_ENV_VALIDATION: 'true'
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright (phone page + mocked ask)
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recsy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recsy
      SUPABASE_SERVICE_ROLE_KEY: e2e-ci-service-role
      GEMINI_API_KEY: e2e-ci-gemini-placeholder
      LLM_PROVIDER: gemini
      NEXT_PUBLIC_SUPABASE_URL: https://example.com
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-ci-anon
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      NODE_ENV: development
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap database
        run: pnpm exec tsx scripts/db-setup.ts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm e2e

  # Hybrid retrieval `eval:retrieval` needs: Postgres, seeded phones, a tiny
  # ingested chunk (see `ci:retrieval-fixture`) and a real Gemini key for
  # query embedding. Entire job is skipped when `GEMINI_API_KEY` secret is unset.
  retrieval-gate:
    name: Check GEMINI for retrieval eval
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY unset — skipping optional retrieval eval."
          fi

  retrieval-eval:
    name: eval · retrieval (optional, Gemini)
    needs: [quality, retrieval-gate]
    if: needs.retrieval-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recsy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recsy
      SUPABASE_SERVICE_ROLE_KEY: e2e-ci-service-role
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: placeholder
      LLM_PROVIDER: gemini
      NEXT_PUBLIC_SUPABASE_URL: https://example.com
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-ci-anon
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      NODE_ENV: development
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap database
        run: pnpm exec tsx scripts/db-setup.ts

      - name: Seed minimal retrieval eval corpus
        run: pnpm ci:retrieval-fixture

      - name: Run hybrid retrieval eval
        run: pnpm exec tsx scripts/eval-retrieval.ts

  # Single required status check for branch protection (Settings → Branches → master).
  # Require: "CI / CI success (required)" — do not require optional retrieval-eval.
  ci-success:
    name: CI success (required)
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: always()
    steps:
      - name: Verify required jobs passed
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "e2e: ${{ needs.e2e.result }}"
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"

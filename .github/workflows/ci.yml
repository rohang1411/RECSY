name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same ref so PR pushes don't stack.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    env:
      # Tests and type-checking touch @/env but do NOT require live services.
      # `SKIP_ENV_VALIDATION` short-circuits the Zod schema so CI can run offline.
      SKIP_ENV_VALIDATION: 'true'
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright (phone page + mocked ask)
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recsy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recsy
      SUPABASE_SERVICE_ROLE_KEY: e2e-ci-service-role
      GEMINI_API_KEY: e2e-ci-gemini-placeholder
      LLM_PROVIDER: gemini
      NEXT_PUBLIC_SUPABASE_URL: https://example.com
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-ci-anon
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      NODE_ENV: development
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap database
        run: pnpm exec tsx scripts/db-setup.ts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm e2e

  # Hybrid retrieval `eval:retrieval` needs: Postgres, seeded phones, a tiny
  # ingested chunk (see `ci:retrieval-fixture`) and a real Gemini key for
  # query embedding. Add repo secret `GEMINI_API_KEY` to enable.
  retrieval-eval:
    name: eval · retrieval (optional, Gemini)
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recsy
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recsy
      SUPABASE_SERVICE_ROLE_KEY: e2e-ci-service-role
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: placeholder
      LLM_PROVIDER: gemini
      NEXT_PUBLIC_SUPABASE_URL: https://example.com
      NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-ci-anon
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
      NODE_ENV: development
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap database
        run: pnpm exec tsx scripts/db-setup.ts

      - name: Seed minimal retrieval eval corpus
        if: env.GEMINI_API_KEY != ''
        run: pnpm ci:retrieval-fixture

      - name: Run hybrid retrieval eval
        if: env.GEMINI_API_KEY != ''
        run: pnpm exec tsx scripts/eval-retrieval.ts

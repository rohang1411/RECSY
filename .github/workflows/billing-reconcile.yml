name: Billing Reconciliation

on:
  schedule:
    # Run every 30 minutes (Section 9.8)
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: billing-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile provider checkouts, subscriptions, and ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run billing reconciliation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_MODE: ${{ secrets.STRIPE_MODE || 'test' }}
          BILLING_ENABLED: 'true'
          NODE_ENV: production
        run: pnpm billing:reconcile

name: Ops Alerts Sweep

on:
  schedule:
    # Run every 5 minutes (Section 13.4)
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ops-alerts
  cancel-in-progress: false

jobs:
  secrets-gate:
    name: Check pipeline secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL not configured — skipping ops alerts sweep."
          fi

  sweep:
    name: Evaluate Operations Alert Rules
    needs: secrets-gate
    if: needs.secrets-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ops alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          QUOTA_MODE: enforce
          LAUNCH_ACTIVE: 'true'
          NODE_ENV: production
          SKIP_ENV_VALIDATION: 'true'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '__OPS_ALERTS_PLACEHOLDER__' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '__OPS_ALERTS_PLACEHOLDER__' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '__OPS_ALERTS_PLACEHOLDER__' }}
        run: pnpm exec tsx scripts/ops-alerts.ts

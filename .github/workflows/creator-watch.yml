# =============================================================================
# RETIRED / DISABLED: Redundant with source-watch.yml (Plan 32 WP-10 / Workflow de-duplication)
# source-watch.yml already polls all 36 verified YouTube creator channels + 10 tech publications on a 6h schedule.
# Scheduled execution is disabled to prevent duplicate crawl_queue inserts and redundant GitHub Actions runner consumption.
# Manual trigger (workflow_dispatch) is preserved for ad-hoc recovery or Airflow backward compatibility.
# =============================================================================
name: creator-watch (retired - use source-watch)

on:
  # Schedule disabled in favor of source-watch.yml:
  # schedule:
  #   - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      max_candidates:
        description: 'Max candidates per phone'
        required: false
        default: '5'
        type: string

concurrency:
  group: creator-watch
  cancel-in-progress: false

jobs:
  secrets-gate:
    name: Check DB secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DB secrets incomplete — skipping (expected for forks / unset repo secrets)."
          fi

  watch:
    name: Poll creator feeds
    needs: secrets-gate
    if: needs.secrets-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      NODE_OPTIONS: --dns-result-order=ipv4first
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '__CREATOR_WATCH_GEMINI_PLACEHOLDER_NOT_USED__' }}
      LOG_LEVEL: info
      SKIP_ENV_VALIDATION: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Poll feeds
        shell: bash
        env:
          INPUT_MAX: ${{ github.event.inputs.max_candidates }}
        run: |
          MAX="${INPUT_MAX:-5}"
          pnpm exec tsx scripts/creator-watch.ts --max-candidates "$MAX"

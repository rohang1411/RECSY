# =============================================================================
# Creator-watch — metadata-only RSS poll for trusted YouTube channels.
#
# Runs every 6 hours. Doesn't pay for transcripts or embeddings — just
# discovers new videos from MKBHD / Mrwhosetheboss / TheTechChap / SuperSaf /
# TheUnlockr / MrMobile, matches them to phones via phone_aliases, and
# enqueues hot-tier crawl_queue rows. The tiered cron picks them up.
#
# Why separate from ingest-tiered.yml?
#   - Different cadence (6h vs daily).
#   - Much cheaper — no embedding / LLM work (script never calls Gemini).
#   - Keeps tiered runtime predictable.
#
# GEMINI_API_KEY: env.ts requires a non-empty key even though this job does not
# call the LLM; we use a harmless placeholder when the secret is unset.
# =============================================================================
name: creator-watch

on:
  schedule:
    # Every 6h, offset from the hour to avoid GH Actions peak.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      max_candidates:
        description: 'Max candidates per phone'
        required: false
        default: '5'
        type: string

concurrency:
  group: creator-watch
  cancel-in-progress: false

jobs:
  secrets-gate:
    name: Check DB secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DB secrets incomplete — skipping (expected for forks / unset repo secrets)."
          fi

  watch:
    name: Poll creator feeds
    needs: secrets-gate
    if: needs.secrets-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      NODE_OPTIONS: --dns-result-order=ipv4first
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '__CREATOR_WATCH_GEMINI_PLACEHOLDER_NOT_USED__' }}
      LOG_LEVEL: info
      SKIP_ENV_VALIDATION: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Poll feeds
        shell: bash
        run: |
          MAX="${{ github.event.inputs.max_candidates || '5' }}"
          pnpm exec tsx scripts/creator-watch.ts --max-candidates "$MAX"

# =============================================================================
# Manual (workflow_dispatch) ingestion for a single phone.
#
# This workflow is intentionally narrow: an operator runs it when they want to
# force ingestion for a specific phone/adapter combination. The scheduled,
# tiered roster lives in `ingest-tiered.yml`.
#
# Triggers:
#   - workflow_dispatch — manual run with optional phone/adapter/limit inputs.
#
# Secrets required (set at repo or organisation level):
#   DATABASE_URL                 — Postgres URI (service_role key embedded).
#   SUPABASE_SERVICE_ROLE_KEY    — validated by env.ts; not used directly here.
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   GEMINI_API_KEY
# =============================================================================
name: ingest (manual)

on:
  workflow_dispatch:
    inputs:
      phone:
        description: 'Phone slug (required). Example: pixel-9-pro-xl'
        required: true
        type: string
      adapter:
        description: 'Adapter: youtube | reddit | article | gsmarena | all'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - youtube
          - reddit
          - article
          - gsmarena
      limit:
        description: 'Max candidates per adapter'
        required: false
        default: '5'
        type: string

concurrency:
  group: ingest-manual-${{ github.event.inputs.phone }}
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest ${{ github.event.inputs.phone }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LOG_LEVEL: info
      SKIP_ENV_VALIDATION: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run manual ingestion
        shell: bash
        run: |
          ADAPTER_FLAG=""
          if [ "${{ github.event.inputs.adapter }}" != "all" ]; then
            ADAPTER_FLAG="--adapter ${{ github.event.inputs.adapter }}"
          fi
          pnpm exec tsx scripts/ingest.ts \
            --phone "${{ github.event.inputs.phone }}" \
            $ADAPTER_FLAG \
            --limit "${{ github.event.inputs.limit }}"

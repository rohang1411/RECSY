# =============================================================================
# Scheduled + manual ingestion.
#
# Triggers:
#   - workflow_dispatch — manual run with optional phone/adapter/limit inputs.
#   - schedule         — nightly at 03:17 UTC (low-traffic window for most
#                        social platforms; staggered off the hour to avoid
#                        GitHub Actions peak).
#
# Secrets required (set at repo or organisation level):
#   DATABASE_URL                 — Postgres URI (service_role key embedded).
#   SUPABASE_SERVICE_ROLE_KEY    — validated by env.ts; not used directly here.
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   GEMINI_API_KEY
#
# Non-secret defaults are set inline to keep this file self-describing.
# =============================================================================
name: ingest

on:
  workflow_dispatch:
    inputs:
      phone:
        description: 'Phone slug (required). Example: pixel-9-pro-xl'
        required: true
        type: string
      adapter:
        description: 'Adapter: youtube | reddit | article | all'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - youtube
          - reddit
          - article
      limit:
        description: 'Max candidates per adapter'
        required: false
        default: '5'
        type: string
  schedule:
    # 03:17 UTC daily.
    - cron: '17 3 * * *'

concurrency:
  group: ingest-${{ github.event.inputs.phone || 'nightly' }}
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest sources for ${{ github.event.inputs.phone || 'nightly-roster' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pipe secrets into the env so `tsx --env-file` is not required here;
      # the Node process reads them natively via `src/env.ts`.
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LOG_LEVEL: info
      # `@t3-oss/env-nextjs` short-circuits validation for CI-shaped builds;
      # ingestion explicitly wants it enabled so missing secrets fail fast.
      SKIP_ENV_VALIDATION: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run manual ingestion
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          ADAPTER_FLAG=""
          if [ "${{ github.event.inputs.adapter }}" != "all" ]; then
            ADAPTER_FLAG="--adapter ${{ github.event.inputs.adapter }}"
          fi
          pnpm exec tsx scripts/ingest.ts \
            --phone "${{ github.event.inputs.phone }}" \
            $ADAPTER_FLAG \
            --limit "${{ github.event.inputs.limit }}"

      - name: Run nightly roster
        if: github.event_name == 'schedule'
        shell: bash
        # For now the nightly roster is hand-curated; Phase 3+ will pull this
        # list from the `phones` table (status = 'active' AND launched in the
        # last N days).
        run: |
          PHONES=(
            "google-pixel-9-pro-xl"
            "apple-iphone-16-pro-max"
            "samsung-galaxy-s25-ultra"
            "nothing-phone-2a-plus"
          )
          FAIL=0
          for slug in "${PHONES[@]}"; do
            echo ""
            echo "::group::ingest $slug"
            if ! pnpm exec tsx scripts/ingest.ts --phone "$slug" --limit 3; then
              FAIL=1
            fi
            echo "::endgroup::"
          done
          exit $FAIL

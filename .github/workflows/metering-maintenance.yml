name: Metering Maintenance

on:
  schedule:
    # Run every 15 minutes (best-effort)
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: metering-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    name: Sweep expired leases and prune old counters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run metering maintenance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: pnpm metering:maintain

      - name: Run database retention pruning
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
        run: pnpm db:prune

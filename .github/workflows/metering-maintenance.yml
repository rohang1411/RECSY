name: Metering Maintenance

on:
  schedule:
    # Run every 15 minutes (best-effort)
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: metering-maintenance
  cancel-in-progress: false

jobs:
  secrets-gate:
    name: Check pipeline secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL not configured — skipping metering maintenance."
          fi

  maintain:
    name: Sweep expired leases and prune old counters
    needs: secrets-gate
    if: needs.secrets-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run metering maintenance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          SKIP_ENV_VALIDATION: 'true'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '__METERING_MAINTENANCE_PLACEHOLDER__' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '__METERING_MAINTENANCE_PLACEHOLDER__' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '__METERING_MAINTENANCE_PLACEHOLDER__' }}
        run: pnpm exec tsx scripts/metering-maintenance.ts

      - name: Run database retention pruning
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          SKIP_ENV_VALIDATION: 'true'
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '__METERING_MAINTENANCE_PLACEHOLDER__' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '__METERING_MAINTENANCE_PLACEHOLDER__' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '__METERING_MAINTENANCE_PLACEHOLDER__' }}
        run: pnpm exec tsx scripts/db-prune.ts
